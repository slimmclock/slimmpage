<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b080d">
  <title>Для Ксюшеньки 💖</title>
  <link rel="stylesheet" href="theme.css?v=9">
  <script src="game.js?v=9" defer></script>
</head>
<body>
  <main>
    <header>
      <div><small>ВАША МАЛЕНЬКАЯ ИСТОРИЯ</small><h1>Для Ксюшеньки 💖</h1></div>
      <span class="badge">Диалог <span id="progress">1 / 11</span></span>
    </header>
    <section class="stage" tabindex="0" aria-label="Игровая сцена. Нажми, чтобы продолжить диалог" aria-describedby="hint">
      <img class="scene-art" src="assets/dungeon-background-v1.webp" alt="Подземелье с цепями и свечами" width="2048" height="2048" draggable="false">
      <div class="character character-yura" aria-hidden="true"><img src="assets/yura-layer.webp" alt="" width="1024" height="1024" draggable="false"></div>
      <div class="character character-her" aria-hidden="true"><img src="assets/her-layer.webp" alt="" width="1024" height="1024" draggable="false"></div>
      <div class="bubble right" role="status" aria-live="polite" aria-atomic="true">
        <span class="speaker">Г</span>
        <span class="line-wrap"><span id="line-sizing" aria-hidden="true">Юра, ко мне!</span><span id="line">Юра, ко мне!</span></span>
      </div>
    </section>
    <div class="controls">
      <button id="next" type="button">Дальше →</button>
      <span class="hint" id="hint">Тапни по сцене · пробел на клавиатуре</span>
    </div>
  </main>
</body>
</html>
